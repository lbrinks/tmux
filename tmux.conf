# Fix Colors
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# set status bar to the top
set-option -g status-position top

# closing a session does not close tmux
set-option -g detach-on-destroy off

# new leader
set -g prefix C-s
unbind C-b
bind-key C-a send-prefix

# hot reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# window management
set -g base-index 1 # start windows numbering at 1
setw -g pane-base-index 1
unbind %
unbind x
bind-key x run-shell "$HOME/.config/tmux/scripts/kill-pane-or-confirm.sh"
bind -r m resize-pane -Z # maximize pane
bind A set-window-option synchronize-panes

bind "'" split-window -c "#{pane_current_path}"
bind ] split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# resizing panes
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r L resize-pane -R 5
bind -r h resize-pane -L 5

# Scrolling
setw -g mouse on

# restore clear keys
bind C-l send-keys 'C-l'
bind C-k send-keys 'C-k'

# lazygit popup
bind l display-popup  -d "#{pane_current_path}"  -w 80%  -h 80%  -E "lazygit"

# session switcher (sesh + fzf)
bind t display-popup -E -w 60% -h 60% "$HOME/.config/tmux/scripts/sesh-connect.sh"

# theme
source-file ~/.config/tmux/themes/nordfox.conf

# bootstrap (TPM + tools)
run "$HOME/.config/tmux/scripts/bootstrap.sh"

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @tpm-clean 'u'
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on' # enable tmux-continuum functionality
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
